services:
  db:
    image: postgres:16-alpine
    container_name: rappio_db
    restart: always
    ports:
      - '5435:5432'
    environment:
      POSTGRES_USER: murmur_user
      POSTGRES_PASSWORD: murmur_pass
      POSTGRES_DB: rappio_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U murmur_user -d rappio_db -h localhost || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    # platform: linux/amd64
    image: softvence/rappio-server:latest
    container_name: rappio_app
    restart: always
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      - ENABLE_MEDIA_SERVER=false
      - ENABLE_API=true
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      echo '⏳ Waiting for DB...' &&
      npx prisma migrate deploy || echo '⚠️ Migration skipped' &&
      node dist/main.js
      "
    volumes:
      - ./uploads:/app/uploads
      - ./media:/app/media

  media:
    image: softvence/rappio-server:latest
    container_name: rappio_media_worker
    restart: always
    ports:
      - '8001:8001' # Media HTTP (HLS)
      - '1935:1935' # RTMP
    env_file:
      - .env
    environment:
      - ENABLE_MEDIA_SERVER=true
      - ENABLE_API=false
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./media:/app/media
volumes:
  pg_data:
