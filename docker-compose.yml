services:
  db:
    image: postgres:15-alpine
    container_name: rappio_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: murmur_user
      POSTGRES_PASSWORD: murmur_pass
      POSTGRES_DB: rappio_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murmur_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: rappio_app
    #network_mode: "host"
    ports:
      - "8000:8000"   # NestJS API
      - "8001:8001"   # Media HTTP (HLS)
      - "1935:1935"   # RTMP
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      echo 'Waiting for DB...' &&
      npx prisma migrate deploy || echo 'Migration skipped' &&
      node dist/main.js
      "
    volumes:
      - ./uploads:/app/uploads
      - ./media:/app/media

volumes:
  pg_data:
