services:
  db:
    image: postgres:15-alpine
    container_name: rappio_db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: murmur_user
      POSTGRES_PASSWORD: murmur_pass
      POSTGRES_DB: rappio_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murmur_user -d rappio_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rappio_network

  app:
    build: .
    container_name: rappio_app
    ports:
      - "8000:8000"   # NestJS API
      - "8001:8001"   # Media HTTP (HLS)
      - "1935:1935"   # RTMP
    env_file:
      - .env
    environment:
      # This overrides any DATABASE_URL in your .env to ensure Docker connectivity
      - DATABASE_URL=postgresql://murmur_user:murmur_pass@db:5432/rappio_db?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rappio_network
    command: >
      sh -c "
      echo 'Waiting for database to be fully functional...' &&
      sleep 3 &&
      npx prisma migrate deploy &&
      node dist/main.js
      "
    volumes:
      - ./uploads:/app/uploads
      - ./media:/app/media

networks:
  rappio_network:
    driver: bridge

volumes:
  pg_data: