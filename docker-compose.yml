version: "3.9"

services:
  rappio_db:
    image: postgres:15-alpine
    container_name: rappio_db
    restart: always
    environment:
      POSTGRES_DB: rappio_db
      POSTGRES_USER: murmur_user
      POSTGRES_PASSWORD: murmur_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murmur_user"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

  romain_redis:
    image: redis:7-alpine
    container_name: romain_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass password123
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rappio-app:
    build: .
    container_name: rappio-app
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      rappio_db:
        condition: service_healthy
      romain_redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./media:/app/media

volumes:
  postgres_data: